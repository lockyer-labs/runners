name: Benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers to run, e.g. "github,depot". Leave blank for every enabled runner.
        required: false
        default: ""
      repetitions:
        description: Number of times to run each runner
        required: false
        default: "3"
      force:
        description: Re-run runners that already have results for the current benchmark version
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      github: ${{ steps.matrix.outputs.github }}
      buildkite: ${{ steps.matrix.outputs.buildkite }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          PROVIDERS: ${{ inputs.providers }}
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          FORCE: ${{ inputs.force }}
        run: |
          version=$(cat bench/VERSION)
          stored='[]'
          if [ "$FORCE" != true ] && git fetch -q --depth 1 origin gh-pages; then
            stored=$(git ls-tree --name-only FETCH_HEAD "results/v$version/" | sed 's#.*/##; s#\.json$##' | jq -R . | jq -sc .)
          fi
          matrix=$(jq -c --arg providers "$PROVIDERS" --argjson reps "$REPETITIONS" --argjson stored "$stored" '
            ($providers | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $wanted
            | {include: [
                .runners[]
                | select(.enabled)
                | select(($wanted | length) == 0 or (.provider | IN($wanted[])))
                | select(.label | IN($stored[]) | not)
                | . as $runner
                | range(1; $reps + 1)
                | $runner + {rep: .}
              ]}' providers.json)
          if [ "$stored" != '[]' ]; then
            echo "Already benchmarked at version $version (run with force to repeat): $(jq -r 'join(", ")' <<<"$stored")" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(jq '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::notice::Nothing to benchmark: every matching runner has results for version $version"
          fi
          jq . <<<"$matrix"
          {
            echo "any=$(jq '.include | length > 0' <<<"$matrix")"
            echo "github=$(jq -c '{include: [.include[] | select(has("buildkite") | not)]}' <<<"$matrix")"
            echo "buildkite=$(jq -c '{include: [.include[] | select(has("buildkite"))]}' <<<"$matrix")"
          } >> "$GITHUB_OUTPUT"

  bench:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.github).include[0] }}
    # analyze.py matches this name against the GitHub API to get queue times.
    name: ${{ matrix.label }} (${{ matrix.rep }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.github) }}
    env:
      CACHE_KEY: bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}-${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Cache steps can fail without stopping the job; run.py records the missing result as an error.
      - name: Generate cache data
        continue-on-error: true
        run: |
          echo "CACHE_DIR=$RUNNER_TEMP/cache-bench" >> "$GITHUB_ENV"
          python bench/cache.py generate "$RUNNER_TEMP/cache-bench"
      - name: Cache save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}
      - name: Clear cache data
        continue-on-error: true
        run: python bench/cache.py saved "$CACHE_DIR"
      - name: Cache restore
        id: restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}
      - name: Check restored data
        continue-on-error: true
        run: python bench/cache.py restored "$CACHE_DIR" "${{ steps.restore.outputs.cache-hit }}"
      - name: Benchmark
        env:
          RUNNER_SPEC: ${{ toJSON(matrix) }}
        run: python bench/run.py --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.label }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
      - name: Delete the cache
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bench/cache.py delete "$CACHE_KEY"

  bench-buildkite:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.buildkite).include[0] }}
    name: ${{ matrix.label }} (${{ matrix.rep }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.buildkite) }}
    steps:
      - uses: actions/checkout@v7
      - name: Benchmark on Buildkite
        env:
          RUNNER_SPEC: ${{ toJSON(matrix) }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: python3 bench/buildkite.py --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.label }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error

  analyze:
    needs: [setup, bench, bench-buildkite]
    if: ${{ !cancelled() && needs.setup.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python analyze/analyze.py --job-timing --json combined/results.json --summary combined/data.json \
            --markdown combined/report.md results
          cat combined/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: combined-results
          path: combined/
          retention-days: 90
      - uses: actions/checkout@v7
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          ref: gh-pages
          path: pages
      - name: Publish to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          scripts/publish.sh combined/results.json pages
          cd pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish results from run ${GITHUB_RUN_ID}"
          git push -q
          echo "Published to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the README's provider table
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          python scripts/readme.py pages/data.json README.md
          if ! git diff --quiet README.md; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update README providers from run ${GITHUB_RUN_ID}" README.md
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
